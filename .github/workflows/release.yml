# Publish to PyPI when a version tag is pushed:  git tag -a v0.2.0 -m "..." && git push origin v0.2.0
#
# Uses PyPI trusted publishing (no API token). One-time setup on PyPI, project metadataschemas →
# Publishing → add a GitHub publisher: owner worldbank, repository metadata-schemas,
# workflow release.yml, environment pypi.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['poetry']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi

      - name: Unit tests
        # The image case fails in the test helper (fill_in_pydantic_outline cannot fill AnyUrl fields),
        # not in the package; deselected until the helper supports URLs.
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest pyyaml
          PYTHONPATH=.:pydantic_schemas python -m pytest pydantic_schemas/tests -q \
            --deselect "pydantic_schemas/tests/test_metadata_manager.py::test_metadata_by_name[image]"

      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
